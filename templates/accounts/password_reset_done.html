{% extends "base.html" %}

{% block title %}Check Your Email{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Check Your Email</h1>
                <p>
                    If an account exists with the email address you provided,
                    we've sent a password reset link. Please check your inbox.
                </p>
            </div>

            <div class="text-center">
                <a href="{% url 'accounts:login' %}" class="btn btn-secondary btn-lg">
                    Back to Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
